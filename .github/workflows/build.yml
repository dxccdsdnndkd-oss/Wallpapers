name: Build APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Locate project
    id: locate
    shell: bash
    run: |
      FOUND=""
      while IFS= read -r FILE; do
        FOUND="$FILE"
        break
      done < <(find . -type f -name gradlew -not -path './.git/*' -print)

      if [ -z "$FOUND" ]; then
        echo "ERROR: gradlew topilmadi"
        find . -maxdepth 4 -type f | head -100
        exit 1
      fi

      DIR="${FOUND%/*}"
      if [ "$DIR" = "$FOUND" ]; then DIR="."; fi
      echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      echo "Loyiha papkasi: $DIR"

  - name: Build APK
    id: build
    continue-on-error: true
    shell: bash
    run: |
      cd "${{ steps.locate.outputs.dir }}"
      chmod +x gradlew
      set -o pipefail
      ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

  - name: Upload build log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: neonwall-build-log
      path: build.log
      if-no-files-found: warn

  - name: Upload APK
    if: steps.build.outcome == 'success'
    uses: actions/upload-artifact@v4
    with:
      name: neonwall-apk
      path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error

  - name: Check build result
    if: steps.build.outcome != 'success'
    run: exit 1
