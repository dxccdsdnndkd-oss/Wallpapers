name: Build APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Find Gradle project
    run: |
      GRADLEW="$(find . -type f -name gradlew -not -path './.git/*' -print -quit)"
      if [ -z "$GRADLEW" ]; then
        echo "ERROR: gradlew topilmadi"
        find . -maxdepth 4 -type f | head -200
        exit 1
      fi
      PROJECT_DIR="$(dirname "$GRADLEW")"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Topilgan loyiha: $PROJECT_DIR"

  - name: Build debug APK
    id: build
    continue-on-error: true
    run: |
      cd "$PROJECT_DIR"
      chmod +x gradlew
      set -o pipefail
      ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

  - name: Upload build log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: neonwall-build-log
      path: build.log
      if-no-files-found: warn

  - name: Upload debug APK
    if: steps.build.outcome == 'success'
    uses: actions/upload-artifact@v4
    with:
      name: neonwall-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error

  - name: Mark failed build
    if: steps.build.outcome != 'success'
    run: exit 1
