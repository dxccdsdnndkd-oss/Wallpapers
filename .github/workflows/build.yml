name: Build APK

on:
push:
branches: [main]
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Unzip project
    run: |
      mkdir -p src
      ZIP_FILE="$(find . -maxdepth 1 -name '*.zip' -print -quit)"
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Repository rootida ZIP topilmadi."
        exit 1
      fi
      unzip -q -o "$ZIP_FILE" -d src
      find src -maxdepth 3 -name gradlew -print

  - name: Locate project
    run: |
      if [ -f src/fixed/gradlew ]; then
        echo "PROJECT_DIR=src/fixed" >> "$GITHUB_ENV"
      elif [ -f src/gradlew ]; then
        echo "PROJECT_DIR=src" >> "$GITHUB_ENV"
      else
        echo "ERROR: gradlew topilmadi. ZIP papka tuzilishini tekshiring."
        exit 1
      fi

  - name: Build debug APK
    id: build
    continue-on-error: true
    run: |
      cd "$PROJECT_DIR"
      chmod +x gradlew
      set -o pipefail
      ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

  - name: Upload build log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: neonwall-build-log
      path: build.log
      if-no-files-found: warn

  - name: Upload APK
    if: steps.build.outcome == 'success'
    uses: actions/upload-artifact@v4
    with:
      name: neonwall-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error

  - name: Fail workflow if build failed
    if: steps.build.outcome != 'success'
    run: exit 1
