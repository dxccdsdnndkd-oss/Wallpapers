name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Zip'ni ochish
        run: unzip -q "$(ls *.zip | head -1)" -d src
      - name: Build
        run: cd src/fixed && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: neonwall-apk
          path: src/fixed/app/build/outputs/apk/debug/app-debug.apk
