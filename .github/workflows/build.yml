name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip
        run: |
          mkdir -p src
          unzip -q -o "$(ls *.zip | head -1)" -d src
          find src -maxdepth 2
      - name: Build debug APK
        run: |
          cd src/fixed
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
      - name: Save log to buildlog branch
        if: always()
        run: |
          git config user.name bot; git config user.email bot@example.com
          git checkout --orphan buildlog
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/build.log build.log 2>/dev/null || echo "no log" > build.log
          git add build.log
          git commit -m "build log"
          git push -f origin buildlog
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neonwall-apk
          path: src/fixed/app/build/outputs/apk/debug/*.apk
