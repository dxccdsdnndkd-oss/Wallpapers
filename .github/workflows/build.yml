
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p src

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP fayl topilmadi"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          unzip -q -o "$ZIP_FILE" -d src

          echo "ZIP ichidagi Gradle fayllari:"
          find src -type f -name gradlew -print

      - name: Find Android project
        shell: bash
        run: |
          GRADLEW="$(find src -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: ZIP ichidan gradlew topilmadi"
            echo "ZIP ichidagi fayllar:"
            find src -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Loyiha topildi: $PROJECT_DIR"

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neonwall-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: neonwall-apk
          path: src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
        
