name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle
        shell: bash
        run: |
          FILE=$(find . -type f -name gradlew -not -path './.git/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "gradlew topilmadi"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neonwall-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
